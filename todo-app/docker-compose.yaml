services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://todo:${POSTGRES_PASSWORD:-todo}@db:5432/todo
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo}
      POSTGRES_DB: todo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # ----- OPTIONAL: TLS-terminating reverse proxy --------------------------
  # Uncomment for HTTPS termination at deploy time. WARNING: adding this
  # service publishes the app to the network. Use a private network, VPN,
  # or Tailscale tailnet — NEVER bind to 0.0.0.0 on a public-internet host.
  # Also set HTTPS_ENABLED=true on the web service so the
  # Strict-Transport-Security header gets sent.
  #
  # proxy:
  #   image: caddy:2-alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #     - caddy-config:/config
  #   depends_on:
  #     web:
  #       condition: service_healthy
  #   restart: unless-stopped
  #
  # Example Caddyfile (next to docker-compose.yaml):
  #
  #   todo.example.lan {
  #       reverse_proxy web:3000
  #   }
  #
  # Caddy auto-provisions Let's Encrypt certs over HTTP-01 if the host
  # is publicly resolvable. For private networks, use Caddy's `tls internal`
  # for self-signed certs:
  #
  #   todo.local {
  #       tls internal
  #       reverse_proxy web:3000
  #   }

volumes:
  pgdata:
  # caddy-data:
  # caddy-config:
